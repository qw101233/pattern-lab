<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>斑图工坊 · 封面</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: #0a0d12;
      color: #e8edf3;
      position: relative;
    }
    /* 背景层：粒子 + 渐变 */
    .bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 800px 1200px at 50% 40%, #1a2230 0%, #0a0d12 60%);
    }
    /* 模拟器装饰图（封面用大珊瑚图当背景） */
    .hero {
      position: absolute;
      width: 880px; height: 880px;
      top: 160px; left: 100px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,138,76,0.2);
    }
    .hero img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 顶部小标签 */
    .tag {
      position: absolute;
      top: 70px; left: 100px;
      font-size: 24px;
      letter-spacing: 4px;
      color: #ff8a4c;
      font-weight: 700;
    }
    .tag::before {
      content: '';
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ff8a4c;
      margin-right: 12px;
      box-shadow: 0 0 16px #ff8a4c;
      vertical-align: middle;
    }
    /* 主标题 */
    .title {
      position: absolute;
      top: 1100px; left: 100px;
      font-size: 130px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 6px;
    }
    .title .accent {
      background: linear-gradient(135deg, #ff8a4c, #ffb677);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* 副标题 */
    .sub {
      position: absolute;
      top: 1280px; left: 100px;
      font-size: 44px;
      color: #8b95a7;
      font-weight: 400;
    }
    /* 描述 */
    .desc {
      position: absolute;
      top: 1380px; left: 100px; right: 100px;
      font-size: 36px;
      line-height: 1.6;
      color: #c5cdd9;
    }
    /* 底部统计 */
    .stats {
      position: absolute;
      bottom: 140px; left: 100px; right: 100px;
      display: flex;
      gap: 20px;
    }
    .stat {
      flex: 1;
      background: rgba(20, 26, 38, 0.7);
      border: 1px solid #2c384a;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
    }
    .stat .num {
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff8a4c, #4cc4ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .stat .lbl {
      font-size: 22px;
      color: #8b95a7;
      margin-top: 12px;
      letter-spacing: 2px;
    }
    /* 底部签名 */
    .foot {
      position: absolute;
      bottom: 50px; left: 100px;
      font-size: 24px;
      color: #5b6678;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="tag">REACTION · DIFFUSION</div>
  <div class="hero">
    <img src="../screenshots/01-default-coral.png" alt="coral" />
  </div>
  <div class="title"><span class="accent">斑图工坊</span></div>
  <div class="sub">Reaction-Diffusion Lab</div>
  <div class="desc">
    两个虚拟化学物质在平面上互相反应 + 扩散，<br/>
    在某些参数下"涌现"出珊瑚、迷宫、漩涡等<br/>
    完全不同的图样——确定性方程里的"涌现生命"。
  </div>
  <div class="stats">
    <div class="stat"><div class="num">GPU</div><div class="lbl">实时渲染</div></div>
    <div class="stat"><div class="num">8</div><div class="lbl">预设图案</div></div>
    <div class="stat"><div class="num">6</div><div class="lbl">调色板</div></div>
  </div>
  <div class="foot">QW · 2026.10</div>
</body>
</html>
